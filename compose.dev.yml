services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: stockmate
      POSTGRES_USER: stockmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stockmate_postgres_data:/var/lin/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=stockmate --dbname=stockmate",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    
  adminer:
    image: adminer:latest
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  stockmate_postgres_data: