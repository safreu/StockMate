services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: aims
      POSTGRES_USER: aims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aims_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=aims --dbname=aims",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    
  adminer:
    image: adminer:latest
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aims_postgres_data: